# Servicio de la aplicación web.
#
# Se expone como NodePort para poder alcanzarlo desde fuera del clúster en un entorno
# local como Minikube o kind, sin depender de un balanceador de nube.
---
apiVersion: v1
kind: Service
metadata:
  name: licitaciones-web
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: licitaciones
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
