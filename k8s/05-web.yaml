# Aplicación web.
---
apiVersion: v1
kind: Service
metadata:
  name: licitaciones-web
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: licitaciones
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: licitaciones-web
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: licitaciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: licitaciones
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: web
          image: licitaciones-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: licitaciones-config
            - secretRef:
                name: licitaciones-secret
          env:
            - name: ConnectionStrings__Default
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"

          # Arranque: da margen a que el proceso levante sin que la sonda de vitalidad lo
          # mate por tardar. Mientras esta no pase, las otras dos ni se ejecutan.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24

          # Disponibilidad: además de responder, alcanza la base. Si falla, el pod sale del
          # servicio pero no se reinicia, porque el problema no es suyo.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Vitalidad: el proceso responde. Si falla, hay que reiniciarlo. No consulta la
          # base a propósito: reiniciar por una base lenta solo produce un ciclo de
          # reinicios que no arregla nada.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Con el sistema de archivos de solo lectura, .NET necesita un lugar donde
            # escribir sus temporales.
            - name: temporales
              mountPath: /tmp
      volumes:
        - name: temporales
          emptyDir: {}
