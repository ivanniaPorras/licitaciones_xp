# PostgreSQL con almacenamiento persistente.
#
# Se despliega como StatefulSet y no como Deployment porque una base de datos tiene
# identidad: su volumen debe seguir siendo el mismo cuando el pod se recrea. Con un
# Deployment, cada nuevo pod podría recibir un volumen distinto.
#
# El volumen se toma del reclamo explícito de `postgres-pvc.yaml`. La razón de no usar
# `volumeClaimTemplates` está explicada en ese archivo.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: licitaciones
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: licitaciones
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: licitaciones
    spec:
      securityContext:
        # El usuario postgres de la imagen oficial.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: licitaciones-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--locale=C --encoding=UTF8"
            # Los datos van en un subdirectorio del volumen: el punto de montaje trae un
            # directorio perdido y encontrado que impide inicializar la base sobre él.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: postgres-datos
