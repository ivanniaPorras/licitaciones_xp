# EJEMPLO. Los valores son ficticios y este archivo no debe aplicarse tal cual.
#
# El secreto real nunca se versiona. Se crea a mano en el clúster con:
#
#   kubectl create secret generic licitaciones-secret \
#     --namespace licitaciones \
#     --from-literal=POSTGRES_USER='usuario_real' \
#     --from-literal=POSTGRES_PASSWORD='contrasena_real'
#
# Se versiona este ejemplo para que quien despliegue sepa exactamente qué claves espera el
# resto de los manifiestos, sin necesidad de leerlos uno por uno.
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-secret
  namespace: licitaciones
  labels:
    app.kubernetes.io/part-of: licitaciones
type: Opaque
stringData:
  POSTGRES_USER: licitaciones_app
  POSTGRES_PASSWORD: cambie_este_valor
