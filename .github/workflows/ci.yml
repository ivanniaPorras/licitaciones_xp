name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Verificar formato
        run: dotnet format --verify-no-changes --severity warn --no-restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Revisar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -q "tiene los siguientes paquetes vulnerables\|has the following vulnerable packages" vulnerables.txt; then
            echo "Se detectaron dependencias con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Ejecutar pruebas
        run: dotnet test --no-build -c Release --verbosity normal
