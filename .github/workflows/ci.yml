name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Verificar formato
        run: dotnet format --verify-no-changes --severity warn --no-restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Revisar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -q "tiene los siguientes paquetes vulnerables\|has the following vulnerable packages" vulnerables.txt; then
            echo "Se detectaron dependencias con vulnerabilidades conocidas."
            exit 1
          fi

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test tests/Licitaciones.UnitTests --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage" --settings .runsettings --results-directory TestResults

      - name: Ejecutar pruebas de integración
        run: >
          dotnet test tests/Licitaciones.IntegrationTests --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage" --settings .runsettings --results-directory TestResults

      - name: Instalar el navegador de las pruebas funcionales
        run: pwsh tests/Licitaciones.FunctionalTests/bin/Release/net9.0/playwright.ps1 install chromium --with-deps

      - name: Ejecutar pruebas funcionales
        run: >
          dotnet test tests/Licitaciones.FunctionalTests --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage" --settings .runsettings --results-directory TestResults

      - name: Generar el informe de cobertura
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"TextSummary;MarkdownSummary;Html"
          cat coverage/Summary.txt

      # La cobertura es una condición de entrega, no una métrica informativa: si baja del
      # umbral acordado el flujo falla y el cambio no se integra.
      - name: Verificar los umbrales de cobertura
        run: python3 scripts/verificar-cobertura.py TestResults

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            TestResults/**/coverage.cobertura.xml
            coverage/

  imagenes:
    name: Construcción de las imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se construyen las dos imágenes para que un fallo en el Dockerfile se vea aquí y no
      # al desplegar.
      - name: Construir la imagen de la aplicación web
        run: docker build -t licitaciones-web:ci --build-arg PROYECTO=Licitaciones.Web .

      - name: Construir la imagen de la API
        run: docker build -t licitaciones-api:ci --build-arg PROYECTO=Licitaciones.Api .

  manifiestos:
    name: Validación de los manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un manifiesto mal formado solo se descubre al desplegar, cuando ya es tarde.
      # kubeconform lo valida contra los esquemas de la API sin necesidad de un clúster.
      - name: Instalar kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validar los manifiestos
        run: kubeconform -strict -summary k8s/
